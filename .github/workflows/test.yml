name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go test
        run: |
          for x in */go.mod; do
            (
              echo "${x%%/go.mod}"
              cd "${x%%/go.mod}"
              go test -race go.winto.dev/...
            )
          done
